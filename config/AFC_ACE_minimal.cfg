# AFC-ACE Minimal Working Configuration
# Use this as a starting point - guaranteed to work without hub errors
#
# This is the absolute minimum config needed for a single ACE Pro

# ==============================================================================
# ACE PRO UNIT
# ==============================================================================

[AFC_ACE ace1]
# Auto-detect first ACE device (recommended)
auto_detect: true
device_index: 0

# Extruder (REQUIRED - must match your printer's extruder name)
extruder: extruder

# Minimum mm the ACE feeds on TOOL_LOAD when hub: direct (AFC's dist_hub default is ~60).
# Tune for your bowden + ACE path; default ~2800 matches typical ACE Pro tool-change feeds.
# direct_tool_load_mm: 2800
#
# USB feed chunk (mm per feed_filament call). Same role as ACEPRO ``incremental_feeding_length``
# (default 50). Override with ``ace_feed_chunk_mm`` if you want a different value than ACEPRO.
# Set 0 for one RPC per move. Example:
# incremental_feeding_length: 50
#
# Bowden lengths AFC reads on hub: direct (required if you still see afc_bowden_length errors).
# Match what you would use on a Box Turtle [AFC_hub] (mm from logical hub to toolhead sensor path).
# afc_bowden_length: 900
# afc_unload_bowden_length: 900

# ==============================================================================
# LANES (one per ACE slot)
# ==============================================================================
# hub: direct is REQUIRED on each lane so AFC TOOL_LOAD uses the direct-to-toolhead
# path (ACE has no physical AFC hub filament sensor). Do not point hub: at an [AFC_hub] unless
# you really have one between ACE and the extruder.
#
# KlipperScreen (AFC panel): lane section names must start with lowercase "lane"
# (e.g. lane1). Names like LANE1 or slot1 are skipped, so T0–Tn will not appear.

[AFC_lane lane1]
unit: ace1:0
map: T0
extruder: extruder
hub: direct

[AFC_lane lane2]
unit: ace1:1
map: T1
extruder: extruder
hub: direct

[AFC_lane lane3]
unit: ace1:2
map: T2
extruder: extruder
hub: direct

[AFC_lane lane4]
unit: ace1:3
map: T3
extruder: extruder
hub: direct

# ==============================================================================
# THAT'S IT! This minimal config should work.
# ==============================================================================
#
# Common mistakes that cause "AFC_hub not found" error:
#
# ❌ WRONG - Don't do this:
#    [AFC_ACE ace1]
#    hub: hub              # ← This requires [AFC_hub hub] section!
#    extruder: extruder
#
# ❌ WRONG - Don't do this:
#    [AFC_lane lane1]
#    unit: ace1:0
#    hub: hub              # ← This also requires [AFC_hub hub] section!
#    extruder: extruder
#
# ✅ CORRECT - Do this:
#    [AFC_ACE ace1]
#    extruder: extruder
#
#    [AFC_lane lane1]
#    unit: ace1:0
#    extruder: extruder
#    hub: direct           # ← required for TOOL_LOAD / filament into nozzle
#
# ==============================================================================
# Next steps:
# ==============================================================================
#
# 1. Copy this file to ~/printer_data/config/AFC/AFC_ACE_Pro.cfg
# 2. Edit extruder name if yours is different (e.g., extruder1)
# 3. Add [include AFC/*.cfg] to printer.cfg
# 4. Restart Klipper
# 5. Run PREP to initialize
#
